---
# Train "hey shadowbot" wake word using openWakeWord on IBM cluster
# Uses H200 MIG 1g.18gb slice for GPU-accelerated training
# Run: KUBECONFIG=~/.kube/ibm-rhai.kubeconfig kubectl apply -f train-wakeword-job.yaml
# Copy model: kubectl cp user-cnuland/<pod>:/output/hey_shadowbot/ ./models/hey_shadowbot/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-hey-shadowbot
  namespace: user-cnuland
  labels:
    app: wakeword-training
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: wakeword-training
        kueue.x-k8s.io/queue-name: unreserved
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          env:
            - name: HOME
              value: /workspace
            - name: PIP_TARGET
              value: /workspace/pip-pkgs
            - name: PYTHONPATH
              value: /workspace/pip-pkgs
            - name: PATH
              value: /workspace/pip-pkgs/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "=== Checking GPU ==="
              python -c "import torch; print('CUDA:', torch.cuda.is_available()); print('Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU')"

              echo "=== Installing dependencies ==="
              mkdir -p /workspace/pip-pkgs
              pip install --no-cache-dir --target=/workspace/pip-pkgs \
                openwakeword \
                piper-tts \
                pathvalidate \
                onnx==1.17.0 \
                onnxruntime==1.18.1 \
                onnxscript 2>&1 | tail -5

              echo "=== Downloading models ==="
              python -c "import openwakeword; openwakeword.utils.download_models()"
              python -m piper.download_voices en_US-lessac-medium --download-dir /workspace/piper_voices

              echo "=== Starting training ==="
              python /workspace/train_wakeword.py

              echo "=== Done ==="
              find /output -type f 2>/dev/null
              echo "=== Sleeping 1h for file copy ==="
              sleep 3600
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              nvidia.com/mig-1g.18gb: "1"
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/mig-1g.18gb: "1"
          volumeMounts:
            - name: output
              mountPath: /output
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: output
          emptyDir:
            sizeLimit: 5Gi
        - name: workspace
          emptyDir:
            sizeLimit: 20Gi
